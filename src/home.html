<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScreenJoule | Reactor workspace</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#242424;font:16px Helvetica,"Helvetica Neue",Arial,sans-serif}header{height:58px;padding:0 28px;display:flex;align-items:center;gap:32px;border-bottom:1px solid #e8e8e8}header b{font-size:25px;letter-spacing:-1px}nav{display:flex;gap:8px}button{font:inherit;border:0;background:#fff;border-radius:28px;padding:11px 18px;color:#666;cursor:pointer}button[aria-selected=true]{background:#242424;color:#fff}button:focus-visible,a:focus-visible{outline:2px solid #777;outline-offset:3px}header>span{margin-left:auto;color:#737373;font-size:14px}iframe{display:block;width:100%;height:calc(100dvh - 58px);border:0;background:#fff}[hidden]{display:none!important}@media(max-width:650px){header{height:108px;padding:14px 18px;gap:12px;flex-wrap:wrap}header>span{display:none}header b{font-size:22px}nav{gap:2px}button{padding:10px 14px}iframe{height:calc(100dvh - 108px)}}
header nav{gap:20px}header nav button{border-radius:0;background:transparent;color:#777;border-bottom:2px solid transparent;padding:10px 8px}header nav button[aria-selected=true]{background:transparent;color:#222;border-bottom-color:#222}header nav button:hover{color:#222}header>span{display:none}
.group-link{margin-left:auto;color:#666;font-size:14px;text-decoration:none;white-space:nowrap}.group-link:hover{color:#222;text-decoration:underline;text-underline-offset:4px}@media(max-width:650px){header b{order:0}.group-link{order:1}header nav{order:2;width:100%}}
</style></head><body><header><b>ScreenJoule</b><nav aria-label="Model dimension" role="tablist"><button id="tab0d" role="tab" aria-selected="true" aria-controls="frame0d">0D</button><button id="tab2d" role="tab" aria-selected="false" aria-controls="frame2d">2D</button><button id="tab3d" role="tab" aria-selected="false" aria-controls="frame3d">3D</button></nav><span id="scope">Lumped energy balance</span><a class="group-link" href="https://dion.che.udel.edu/" target="_blank" rel="noopener noreferrer">Vlachos Group</a></header><main id="models"></main><script>
const descriptions={'0d':'Lumped energy balance','2d':'Axisymmetric electrothermal field','3d':'Spatial electrothermal field | Stokes flow'},frames={};
function selectModel(key){if(!descriptions[key])key='0d';if(!frames[key]){const frame=document.createElement('iframe');frame.id='frame'+key;frame.title='Joule'+key.toUpperCase()+' independent workspace';frame.src=key==='3d'?'joule3d.html':'suite/joule'+key+'.html';frame.setAttribute('role','tabpanel');frame.setAttribute('aria-labelledby','tab'+key);document.getElementById('models').append(frame);frames[key]=frame;}for(const k of Object.keys(descriptions)){document.getElementById('tab'+k).setAttribute('aria-selected',String(k===key));if(frames[k])frames[k].hidden=k!==key;}document.getElementById('scope').textContent=descriptions[key];history.replaceState(null,'','#joule'+key);}
for(const k of Object.keys(descriptions))document.getElementById('tab'+k).onclick=()=>selectModel(k);
window.addEventListener('hashchange',()=>selectModel(location.hash.replace('#joule','')||'3d'));selectModel(location.hash.replace('#joule','')||'3d');
document.querySelector('nav').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const keys=Object.keys(descriptions),i=keys.findIndex(k=>document.getElementById('tab'+k)===document.activeElement),key=keys[(i+(e.key==='ArrowRight'?1:2))%3];document.getElementById('tab'+key).focus();selectModel(key);});
</script></body></html>
